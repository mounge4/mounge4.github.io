<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <linearGradient id="rgb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/><stop offset="25%" stop-color="#34A853"/>
      <stop offset="50%" stop-color="#FBBC05"/><stop offset="75%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#4285F4"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 180 180" to="360 180 180" dur="5s" repeatCount="indefinite"/>
