    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="circle"><circle cx="180" cy="180" r="135"/></clipPath>
  </defs>
  <circle cx="180" cy="180" r="153" fill="none" stroke="url(#rgb)" stroke-width="18" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 180 180" to="360 180 180" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="180" r="137" fill="#fff"/>
  <image x="45" y="45" width="270" height="270" preserveAspectRatio="xMidYMid slice" clip-path="url(#circle)" href="https://lh3.googleusercontent.com/d/1Zzr8jDb97O_ChO4ma1i2aUOEwc3xbJyt"/>
