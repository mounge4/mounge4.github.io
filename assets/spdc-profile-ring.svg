<div class="profile-ring-wrapper">
  <div class="google-ring"></div>
  <img src="https://lh3.googleusercontent.com/d/1Zzr8jDb97O_ChO4ma1i2aUOEwc3xbJyt" class="profile-img" alt="SPDC">
</div>

<style>
.profile-ring-wrapper{
  width: 110px;
  height: 110px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.google-ring{
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: conic-gradient(
    #4285F4 0deg 90deg,
    #EA4335 90deg 180deg,
    #FBBC05 180deg 270deg,
    #34A853 270deg 360deg
  );
  animation: rotate-ring 1.5s linear infinite;
  filter: drop-shadow(0 0 6px rgba(66,133,244,0.6));
}
.google-ring::before{
  content: '';
  position: absolute;
  inset: 5px;
  background: white;
  border-radius: 50%;
  z-index: 1;
}
.profile-img{
  width: 88px;
  height: 88px;
  border-radius: 50%;
  object-fit: cover;
  position: relative;
  z-index: 2;
  border: 2px solid white;
}
@keyframes rotate-ring{
  0%{ transform: rotate(0deg); }
  100%{ transform: rotate(360deg); }
}
</style>
